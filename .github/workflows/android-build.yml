name: Build signed Android APK

# Manual only - the PWA (plans.dbuilder.eu) already updates itself on every
# push via the service worker, and the APK is just a static wrapper shell
# around it. Rebuilding/re-signing an APK for every small web change isn't
# needed - trigger this by hand (Actions tab -> this workflow -> Run
# workflow) only when you actually want a fresh installable APK.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > plans-release.jks
          cat > keystore.properties << PROPS
          storeFile=plans-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean up signing key
        if: always()
        working-directory: android
        run: rm -f plans-release.jks keystore.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plans-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
